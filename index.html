<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Gefrierschrank NFC Manager</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --surface-hover: #e2e8f0;
      --border: #e2e8f0;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --primary-soft: #e0f2fe;
      --accent: #059669;
      --accent-soft: #d1fae5;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --warning: #b45309;
      --warning-soft: #fef3c7;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 16px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
      min-height: 100vh;
    }

    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .status-badge {
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .status-badge.sim {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--surface-subtle);
      padding: 4px;
      border-radius: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 6px;
      background: transparent;
      border: none;
      border-radius: 9px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.18s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-subtle);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-accent-soft {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.8rem;
      width: auto;
      border-radius: 9px;
    }

    .scan-hero {
      text-align: center;
      padding: 28px 18px;
    }

    .nfc-pulse {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: var(--primary-soft);
      border: 2px solid #bae6fd;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 2rem;
    }

    .nfc-pulse.scanning {
      border-color: var(--primary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.35); }
      70% { box-shadow: 0 0 0 18px rgba(2, 132, 199, 0); }
      100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.92rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    .sim-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .sim-tag-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sim-tag-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .sim-tag-title {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
    }

    .sim-tag-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Unter-Reiter für Fächer im Bestand */
    .drawer-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .drawer-tabs::-webkit-scrollbar {
      display: none;
    }

    .drawer-tab {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .drawer-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .drawer-section-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin: 14px 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-section-header:first-child {
      margin-top: 0;
    }

    .manual-add-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      display: none;
    }

    .manual-add-box.open {
      display: block;
    }

    /* Item Liste */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      gap: 10px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-weight: 600;
      font-size: 0.94rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s;
    }

    .qty-btn.take {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
    }

    .qty-btn.add {
      background: var(--accent-soft);
      border-color: #a7f3d0;
      color: var(--accent);
    }

    .qty-val {
      min-width: 32px;
      text-align: center;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text);
    }

    /* Modal / Bottom Sheet */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px
